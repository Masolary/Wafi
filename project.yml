name: NovelCoolReaderGuard
options:
  bundleIdPrefix: com.masolary
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  NovelCoolReaderGuard:
    type: application
    platform: iOS
    sources:
      - path: ios/Host
    info:
      path: generated/Host-Info.plist
      properties:
        CFBundleDisplayName: Reader Guard
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masolary.NovelCoolReaderGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NovelCoolSafariExtension
        embed: true
  NovelCoolSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Extension
      - path: extension
        buildPhase: resources
        type: group
    info:
      path: generated/Extension-Info.plist
      properties:
        CFBundleDisplayName: NovelCool Reader Guard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masolary.NovelCoolReaderGuard.Extension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SafariServices.framework
schemes:
  NovelCoolReaderGuard:
    build:
      targets:
        NovelCoolReaderGuard: all
    run:
      config: Debug
    archive:
      config: Release
